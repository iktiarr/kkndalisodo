<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffc000"/>
      <stop offset="100%" stop-color="#917300"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
  </defs>

  <!-- Outer Ring -->
  <circle cx="100" cy="100" r="92" fill="#202020" stroke="url(#goldGrad)" stroke-width="6"/>
  <circle cx="100" cy="100" r="82" fill="none" stroke="#494949" stroke-width="2"/>

  <!-- Mountain Peaks (Gunung Kawi) -->
  <polygon points="40,135 85,70 120,110 160,135" fill="url(#emeraldGrad)"/>
  <polygon points="85,70 100,90 120,110 105,80" fill="#22c55e" opacity="0.4"/>
  <polygon points="85,70 70,135 100,135" fill="#166534" opacity="0.6"/>

  <!-- Golden Sun -->
  <circle cx="130" cy="65" r="14" fill="url(#goldGrad)"/>

  <!-- River Stream -->
  <path d="M90 135 Q100 115 110 125 T120 135" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>

  <!-- Shield Base Banner -->
  <path d="M 35 135 Q 100 175 165 135 V 148 Q 100 188 35 148 Z" fill="url(#goldGrad)"/>
  
  <!-- Text Label -->
  <text x="100" y="152" font-family="'Barlow Condensed', sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle" letter-spacing="1">DALISODO</text>
  <text x="100" y="44" font-family="'Barlow Condensed', sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">DESA DALISODO</text>
</svg>
